server:
  port: 8080

spring:
  application:
    name: mediqueue-core-service
  datasource:
    url: jdbc:h2:mem:mediqueuedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# Production MySQL Profile:
# spring.datasource.url=jdbc:mysql://localhost:3306/mediqueue_db?useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=password
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

mediqueue:
  average-service-time-minutes: 5
  kiosk:
    idle-timeout-seconds: 60
    default-language: en
  demo:
    mode: true
