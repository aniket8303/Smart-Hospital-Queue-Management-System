mediqueue:
  hospital:
    name: Diksha Hospital
    timezone: Asia/Kolkata
  average-service-time-minutes: 5
  kiosk:
    idle-timeout-seconds: 60
    default-language: en
  demo:
    mode: true

logging:
  level:
    com.mediqueue: INFO
    org.springframework.security: WARN

